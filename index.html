        <style>

        /*  レトロなフィルター by VS code's AI  */
        #GameCanvas {
            touch-action: none;
            filter: blur(0.5px) contrast(1.2) brightness(1.1);
            background-color: rgb(255, 255, 255);
        }
        
        

        div.texts {
            width: max-content;
            margin-left: 2em;
            margin-right: auto;

        }

        body {
            display: flex;
            align-items: flex-start;
            background-color: rgb(0, 16, 32);
            color: rgb(208, 240, 252);
        }

        div.ORG-MODE-shown,
        div.FPS-MODE-shown {
            display: inline-block;
            vertical-align: top;
            text-align: left;
            font-size: 1.3rem;
        }
        div.redTXT {
            color: red;
        }
        div.greenTXT {
            color: green;
        }
        div.lightGreenTXT {
            color: lightgreen;
        }
        div.pinkTXT {
            color: pink;
        }
        div.skyBlueTXT {
            color: skyblue;
        }
        div.yellowTXT {
            color: yellow;
        }

        img.howToPlayIMG{
            width: 200%;
            height: 200%;
            /* for Chrome, Edge, Safari*/
            image-rendering: pixelated;
            /* for Firefox */
            image-rendering: crisp-edges;
            

        }
        
        #howToTitle{
            font-size: 1.5rem;
        }

        </style>

    </head>
    <body>
        <canvas id = "GameCanvas" width = "720" Height = "540"></canvas>
        <div class="texts">
            <h2 id="howToTitle">＜操作方法＞</h2>
            <p>
                ＜デバッグ用めっせーじ＞<br>
                ＊水色の枠は「そのオブジェクトのグラフィック描画範囲」である。<br>
                ＊水色以外の四角枠は「そのオブジェクトの真下に描かれる基本接触時当たり判定」である。
                <div class="ORG-MODE-shown">
                    ＜ORGモード＞<br>
                    矢印キー または ＷＡＳＤ で操作<br>
                    Zキー で攻撃<br>
                    Xキー でジャンプ<br>
                    Cキー でステップ<br>
                    スペースキーでポーズ<br><br>
                    <img class="howToPlayIMG" src="./assets/imgs/howToPlay_ORG.png" alt="How to Play on ORG-MODE">
                </div>
                <div class="FPS-MODE-shown">
                    ＜FPSモード＞<br>
                    ＷＡＳＤ で操作<br>
                    マウスクリック で攻撃<br>
                    スペースキー でジャンプ<br>
                    シフト + スペースキー でステップ<br>
                    Q,R,Pキーでポーズ<br><br>
                    <img class="howToPlayIMG" src="./assets/imgs/howToPlay_FPS.png" alt="How to Play on FPS-MODE">
                </div>
            </p>
        </div>
    </body>
